</head>

<body>
    <header>
    <h1>My Site</h1>
    <nav>
        <a href="/">Home</a>
        <a href="/about/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/notes/">Notes</a>
        <a href="/contact/">Contact</a>
        <a href="/tags/">Tags</a>
    </nav>
</header>
    <h1>My Projects</h1>
<select id="tag-filter">
<option value="">All</option>
<option value="web">web</option>
<option value="project">project</option>
<option value="app">app</option>
<option value="demo">demo</option>
</select>
<ul id="project-list">
<li data-tags="web,project"><a href="/projects/first-project/">My First Project</a>: A sample project</li>
<li data-tags="app,demo"><a href="/projects/second-project/">Second Project</a>: Another project</li>
<li data-tags="mobile,app"><a href="/projects/third-project/">Third Project</a>: A mobile app project</li>
<li data-tags="design,ui"><a href="/projects/fourth-project/">Fourth Project</a>: A UI design project</li>
</ul>
<script>

document.getElementById('tag-filter').addEventListener('change', function() {

  const tag = this.value;

  const items = document.querySelectorAll('#project-list li');

  items.forEach(item => {

    const itemTags = item.dataset.tags.split(',');

    item.style.display = !tag || itemTags.includes(tag) ? '' : 'none';

  });

});

</script>

</footer>
</body>
